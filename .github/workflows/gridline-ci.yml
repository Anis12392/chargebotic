name: GridLine AI CI

on:
  push:
    branches: [main, 'claude/**']
    paths: ['gridline/**', '.github/workflows/gridline-ci.yml']
  pull_request:
    paths: ['gridline/**', '.github/workflows/gridline-ci.yml']

concurrency:
  group: gridline-${{ github.ref }}
  cancel-in-progress: true

env:
  # CI must never reach the vision provider or Overpass: the tests would become
  # non-deterministic and would spend money on every push.
  VISION_ENABLED: 'false'
  EXTERNAL_GIS_ENABLED: 'false'

jobs:
  backend:
    name: Backend — lint and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gridline/backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: gridline/backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check app tests

      - name: Test
        run: pytest -q

  migrations:
    name: Backend — migrations apply to PostGIS
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gridline/backend

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: gridline
          POSTGRES_PASSWORD: gridline
          POSTGRES_DB: gridline
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U gridline -d gridline"
          --health-interval 5s --health-timeout 5s --health-retries 12

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: gridline/backend/requirements.txt

      - run: pip install -r requirements.txt

      - name: Apply migrations
        env:
          DATABASE_URL: postgresql+asyncpg://gridline:gridline@localhost:5432/gridline
        run: alembic upgrade head

      # A migration that cannot be rolled back is a migration you cannot deploy
      # on a Friday.
      - name: Verify downgrade
        env:
          DATABASE_URL: postgresql+asyncpg://gridline:gridline@localhost:5432/gridline
        run: alembic downgrade base

  frontend:
    name: Frontend — typecheck, test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gridline/frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: gridline/frontend/package-lock.json

      - run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  images:
    name: Build container images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - component: backend
            context: gridline/backend
          - component: frontend
            context: gridline/frontend

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          # Only publish from main; PRs build to prove the Dockerfile works.
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/gridline-${{ matrix.component }}:latest
            ghcr.io/${{ github.repository_owner }}/gridline-${{ matrix.component }}:${{ github.sha }}
          cache-from: type=gha,scope=gridline-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=gridline-${{ matrix.component }}
