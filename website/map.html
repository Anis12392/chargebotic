<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chargebotic | Grid Map</title>
    <meta name="description" content="The Chargebotic grid map: where power lines run, we can charge. Night Earth view of transmission corridors.">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23e8490a'/><text x='50' y='50' dy='.35em' text-anchor='middle' font-family='Arial,sans-serif' font-size='70' font-weight='800' fill='white'>C</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg:    #0a0a0b;
            --text:  #f5f5f3;
            --muted: #b4b4b1;
            --faint: #6a6a67;
            --line:  rgba(255,255,255,0.12);
            --brand: #e8490a;
            --gold:  #ffb84d;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', -apple-system, sans-serif; -webkit-font-smoothing: antialiased; overflow: hidden; }
        a { color: inherit; text-decoration: none; }

        #globe { position: fixed; inset: 0; }

        .nav { position: fixed; top: 0; left: 0; right: 0; z-index: 10; background: linear-gradient(to bottom, rgba(10,10,11,0.85), transparent); }
        .nav-inner { max-width: 1320px; margin: 0 auto; padding: 22px 40px; display: flex; align-items: center; justify-content: space-between; }
        .logo { display: flex; align-items: center; gap: 13px; }
        .logo-mark { width: 30px; height: 30px; border-radius: 6px; background: var(--brand); color: #fff; font-weight: 700; font-size: 1.04rem; display: flex; align-items: center; justify-content: center; }
        .logo-name { font-weight: 600; font-size: 1rem; letter-spacing: 0.2em; text-transform: uppercase; }
        .nav-back { font-size: 0.88rem; color: var(--muted); }
        .nav-back:hover { color: var(--text); }

        .panel { position: fixed; left: 40px; top: 110px; z-index: 10; max-width: 380px; pointer-events: none; }
        .panel > * { pointer-events: auto; }
        .eyebrow { font-size: 0.74rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--gold); margin-bottom: 18px; }
        h1 { font-size: clamp(1.9rem, 3.4vw, 2.8rem); font-weight: 700; letter-spacing: -0.03em; line-height: 1.08; margin-bottom: 14px; }
        .sub { color: var(--muted); font-size: 0.98rem; line-height: 1.55; margin-bottom: 26px; }
        .flyto { display: flex; gap: 10px; flex-wrap: wrap; }
        .flyto button { font-size: 0.85rem; font-weight: 600; padding: 12px 20px; border: 1px solid var(--line); background: rgba(10,10,11,0.7); color: var(--text); cursor: pointer; transition: all 0.2s; }
        .flyto button:hover { border-color: var(--gold); color: var(--gold); }
        .flyto button.active { background: var(--gold); border-color: var(--gold); color: #131007; }

        .legend { position: fixed; left: 40px; bottom: 34px; z-index: 10; font-size: 0.76rem; color: var(--faint); letter-spacing: 0.06em; }
        .legend .swatch { display: inline-block; width: 26px; height: 3px; background: linear-gradient(90deg, var(--gold), var(--brand)); vertical-align: middle; margin-right: 10px; border-radius: 2px; }
        .legend .note { display: block; margin-top: 8px; }

        .hint { position: fixed; right: 40px; bottom: 34px; z-index: 10; font-size: 0.76rem; color: var(--faint); letter-spacing: 0.08em; text-transform: uppercase; }

        @media (max-width: 640px) {
            .panel { left: 24px; right: 24px; top: 96px; }
            .legend { left: 24px; }
            .hint { display: none; }
        }
    </style>
</head>
<body>
    <div id="globe"></div>

    <nav class="nav">
        <div class="nav-inner">
            <a href="/" class="logo"><div class="logo-mark">C</div><span class="logo-name">Chargebotic</span></a>
            <a href="/" class="nav-back">Back to site</a>
        </div>
    </nav>

    <div class="panel">
        <div class="eyebrow">Grid Map</div>
        <h1>Where a line runs, we can charge.</h1>
        <p class="sub">Every gold route is a transmission corridor: an energy source already in place. Drag to orbit, scroll to zoom.</p>
        <div class="flyto">
            <button id="btnEarth" class="active">Earth</button>
            <button id="btnCal">California</button>
            <button id="btnTexas">Texas</button>
            <button id="btnEurope">Europe</button>
        </div>
    </div>

    <div class="legend">
        <span><span class="swatch"></span>Transmission corridors</span>
        <span class="note">Illustrative map. Full grid dataset integration in progress.</span>
    </div>
    <div class="hint">Drag to orbit · Scroll to zoom</div>

    <script src="https://cdn.jsdelivr.net/npm/globe.gl@2.32.0/dist/globe.gl.min.js"></script>
    <script>
        // Representative transmission corridors as [lat, lng] paths.
        // California drawn in detail; other regions sketched for global context.
        const CA = [
            // Pacific Intertie: Oregon border down the Central Valley to Los Angeles
            [[42.0,-121.9],[40.9,-122.3],[40.2,-122.2],[39.3,-122.0],[38.5,-121.6],[37.6,-121.2],[36.8,-120.6],[35.9,-119.6],[35.1,-118.3],[34.6,-118.1],[34.05,-118.25]],
            // Coastal corridor: San Francisco to Los Angeles
            [[37.75,-122.4],[37.2,-121.9],[36.6,-121.7],[35.6,-121.0],[35.2,-120.7],[34.9,-120.4],[34.5,-119.7],[34.05,-118.25]],
            // Tehachapi east toward Las Vegas
            [[34.9,-118.5],[35.1,-117.8],[35.4,-116.8],[35.8,-115.9],[36.1,-115.17]],
            // San Diego to Imperial Valley
            [[32.72,-117.15],[32.8,-116.5],[32.9,-115.9],[33.0,-115.5]],
            // Los Angeles to the Colorado River
            [[34.05,-118.25],[33.9,-117.4],[33.8,-116.5],[33.7,-115.4],[33.6,-114.6]],
            // Central Valley eastern spine
            [[38.6,-121.4],[38.0,-120.8],[37.3,-120.3],[36.7,-119.7]],
            // Bay Area loop
            [[38.0,-122.3],[37.9,-122.0],[37.6,-121.9],[37.35,-121.85],[37.4,-122.2],[37.8,-122.35],[38.0,-122.3]],
            // North coast
            [[40.8,-124.1],[40.5,-123.5],[40.0,-122.9],[39.5,-122.3]],
            // Sacramento to Reno
            [[38.6,-121.3],[39.1,-120.6],[39.45,-119.95]],
            // San Joaquin link
            [[36.7,-119.8],[35.9,-119.2],[35.35,-119.0],[35.0,-119.4],[34.9,-119.9]],
        ];
        const WORLD = [
            // US East coast spine
            [[42.4,-71.1],[40.7,-74.0],[39.9,-75.2],[38.9,-77.0],[37.5,-77.4],[35.8,-78.6],[33.7,-84.4]],
            // Texas triangle
            [[32.8,-96.8],[29.8,-95.4],[29.4,-98.5],[32.8,-96.8]],
            // Midwest corridor
            [[41.9,-87.6],[41.3,-95.9],[39.7,-104.9]],
            // Pacific Northwest
            [[47.6,-122.3],[45.5,-122.7],[44.0,-121.3],[42.0,-121.9]],
            // Western Europe mesh
            [[51.5,-0.1],[48.9,2.3],[50.1,8.7],[52.5,13.4]],
            [[48.9,2.3],[45.8,4.8],[41.9,12.5]],
            [[52.4,4.9],[50.9,6.9],[48.1,11.6]],
            // Nile corridor
            [[31.2,29.9],[30.0,31.2],[26.8,31.8],[24.1,32.9]],
            // India corridor
            [[28.6,77.2],[26.9,75.8],[23.0,72.6],[19.1,72.9]],
            // East China corridor
            [[39.9,116.4],[34.8,113.7],[31.2,121.5],[23.1,113.3]],
            // Japan spine
            [[35.7,139.7],[35.2,136.9],[34.7,135.5]],
            // Brazil corridor
            [[-23.5,-46.6],[-22.9,-43.2],[-19.9,-43.9]],
        ];
        // Fat-line stroke is unreliable across GPUs, so each corridor is layered:
        // three bright 1px cores side by side plus two soft glow lines make a gold road.
        const corridors = [...CA, ...WORLD];
        const shift = (coords, d) => coords.map(([la, ln]) => [la + d, ln + d]);
        const paths = corridors.flatMap(c => [
            { coords: c, color: '#ffc45e' },
            { coords: shift(c, 0.028), color: '#ffc45e' },
            { coords: shift(c, -0.028), color: '#ffc45e' },
            { coords: shift(c, 0.068), color: 'rgba(255,170,60,0.35)' },
            { coords: shift(c, -0.068), color: 'rgba(255,170,60,0.35)' },
        ]);

        const cities = [
            { lat: 37.77, lng: -122.42, name: 'San Francisco' },
            { lat: 34.05, lng: -118.25, name: 'Los Angeles' },
            { lat: 32.72, lng: -117.15, name: 'San Diego' },
            { lat: 38.58, lng: -121.49, name: 'Sacramento' },
        ];

        const globe = Globe()(document.getElementById('globe'))
            .globeImageUrl('https://cdn.jsdelivr.net/npm/three-globe/example/img/earth-night.jpg')
            .backgroundImageUrl('https://cdn.jsdelivr.net/npm/three-globe/example/img/night-sky.png')
            .atmosphereColor('#26456e')
            .atmosphereAltitude(0.16)
            .pathsData(paths)
            .pathPoints(d => d.coords)
            .pathPointLat(p => p[0])
            .pathPointLng(p => p[1])
            .pathColor(d => d.color)
            .pathStroke(null)
            .pathPointAlt(() => 0.004)
            .pathDashLength(0.9)
            .pathDashGap(0.02)
            .pathDashAnimateTime(18000)
            .labelsData(cities)
            .labelLat(d => d.lat)
            .labelLng(d => d.lng)
            .labelText(d => d.name)
            .labelSize(0.55)
            .labelDotRadius(0.22)
            .labelColor(() => 'rgba(255,196,94,0.9)')
            .labelAltitude(0.008)
            .width(window.innerWidth)
            .height(window.innerHeight)
            .pointOfView({ lat: 25, lng: -60, altitude: 2.4 });

        globe.controls().autoRotate = true;
        globe.controls().autoRotateSpeed = 0.5;
        globe.controls().addEventListener('start', () => { globe.controls().autoRotate = false; });

        const buttons = {
            btnEarth:  { lat: 25, lng: -60, altitude: 2.4, rotate: true },
            btnCal:    { lat: 36.6, lng: -119.0, altitude: 0.55, rotate: false },
            btnTexas:  { lat: 31.0, lng: -97.5, altitude: 0.6, rotate: false },
            btnEurope: { lat: 48.5, lng: 6.0, altitude: 0.7, rotate: false },
        };
        for (const [id, view] of Object.entries(buttons)) {
            document.getElementById(id).addEventListener('click', (e) => {
                document.querySelectorAll('.flyto button').forEach(b => b.classList.remove('active'));
                e.currentTarget.classList.add('active');
                globe.controls().autoRotate = view.rotate;
                globe.pointOfView({ lat: view.lat, lng: view.lng, altitude: view.altitude }, 2400);
            });
        }

        // Fit the globe to whatever size the viewport actually has.
        // Retries automatically, so a zero-size start (hidden tab, prerender) recovers.
        let lastW = 0, lastH = 0;
        function fitGlobe() {
            const w = document.documentElement.clientWidth || window.innerWidth || screen.width || 1280;
            const h = document.documentElement.clientHeight || window.innerHeight || screen.height || 720;
            if (w > 0 && h > 0 && (w !== lastW || h !== lastH)) {
                lastW = w; lastH = h;
                globe.width(w).height(h);
            }
        }
        fitGlobe();
        setInterval(fitGlobe, 600);
        window.addEventListener('resize', fitGlobe);
    </script>
</body>
</html>
