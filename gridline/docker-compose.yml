name: gridline

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: gridline
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gridline}
      POSTGRES_DB: gridline
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gridline -d gridline']
      interval: 5s
      timeout: 5s
      retries: 12

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-gridline}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-gridline-dev-secret}
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 12

  # One-shot: creates the bucket the API writes to, then exits.
  minio-init:
    image: minio/mc:RELEASE.2024-11-21T17-21-54Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY_ID:-gridline} ${S3_SECRET_ACCESS_KEY:-gridline-dev-secret} &&
      mc mb --ignore-existing local/gridline-inspections &&
      echo 'bucket ready'
      "

  migrate:
    build:
      context: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://gridline:${POSTGRES_PASSWORD:-gridline}@postgres:5432/gridline
    command: ['alembic', 'upgrade', 'head']
    restart: 'no'

  backend:
    build:
      context: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgresql+asyncpg://gridline:${POSTGRES_PASSWORD:-gridline}@postgres:5432/gridline
      CORS_ORIGINS: http://localhost:3000
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET: gridline-inspections
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-gridline}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-gridline-dev-secret}
      S3_PUBLIC_BASE_URL: http://localhost:9000/gridline-inspections
      # Unset by default: the stack runs on the deterministic fallback analyzer
      # and says so in every report, rather than silently costing money.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      VISION_MODEL: ${VISION_MODEL:-gpt-4o}
      EXTERNAL_GIS_ENABLED: ${EXTERNAL_GIS_ENABLED:-true}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
    ports:
      - '8000:8000'

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://backend:8000
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://backend:8000
    ports:
      - '3000:3000'

volumes:
  postgres-data:
  minio-data:
