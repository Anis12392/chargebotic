name: gridline

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: gridline
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gridline}
      POSTGRES_DB: gridline
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gridline -d gridline']
      interval: 5s
      timeout: 5s
      retries: 12

  # S3 is opt-in: `docker compose --profile s3 up`. The default stack stores
  # photos on a local volume instead, because a MinIO URL is absolute
  # (http://localhost:9000/...) and "localhost" means the *phone* when you open
  # the app from a handset. Local storage returns relative /media/... paths that
  # resolve against whatever origin the browser actually used.
  minio:
    profiles: ['s3']
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-gridline}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-gridline-dev-secret}
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 12

  # One-shot: creates the bucket the API writes to, then exits.
  minio-init:
    profiles: ['s3']
    image: minio/mc:RELEASE.2024-11-21T17-21-54Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY_ID:-gridline} ${S3_SECRET_ACCESS_KEY:-gridline-dev-secret} &&
      mc mb --ignore-existing local/gridline-inspections &&
      mc anonymous set download local/gridline-inspections &&
      echo 'bucket ready'
      "
    # The anonymous download grant is what makes S3_PUBLIC_BASE_URL work: `mc mb`
    # creates a private bucket, so without it every photo and thumbnail 403s in
    # the browser. This is a localhost dev convenience — in production, serve
    # inspection photos through presigned URLs or a CDN with real auth, never a
    # world-readable bucket.

  migrate:
    build:
      context: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://gridline:${POSTGRES_PASSWORD:-gridline}@postgres:5432/gridline
    command: ['alembic', 'upgrade', 'head']
    restart: 'no'

  backend:
    build:
      context: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgresql+asyncpg://gridline:${POSTGRES_PASSWORD:-gridline}@postgres:5432/gridline
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      LOCAL_STORAGE_DIR: /data/photos
      # Empty unless you opt into S3 with `--profile s3`; the backend falls back
      # to LOCAL_STORAGE_DIR whenever these are blank.
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
      # Without a key the stack runs the deterministic fallback analyzer and
      # says so in every report, rather than silently costing money.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      VISION_MODEL: ${VISION_MODEL:-gpt-4o}
      EXTERNAL_GIS_ENABLED: ${EXTERNAL_GIS_ENABLED:-true}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
    volumes:
      - photo-data:/data/photos
    ports:
      - '8000:8000'

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://backend:8000
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://backend:8000
    ports:
      - '3000:3000'

volumes:
  postgres-data:
  minio-data:
  photo-data:
